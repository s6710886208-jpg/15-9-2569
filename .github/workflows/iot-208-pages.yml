name: Deploy iot-208 dashboard
on:
  push:
    branches: [main]
    paths:
      - 'freeboard/**'
      - '.github/workflows/iot-208-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: iot-208-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: freeboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

